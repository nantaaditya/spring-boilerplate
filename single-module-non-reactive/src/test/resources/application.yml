server:
  port: 8080
  servlet:
    context-path: ${CONTEXT_PATH:}

spring:
  application.name: example-app-test
  threads:
    virtual.enabled: true

  banner:
    location: classpath:banner.txt

  flyway:
    enabled: false
    baseline-on-migrate: false
    validate-on-migrate: false
    locations: classpath:db/migration

  datasource:
    url: jdbc:h2:mem:exampledb
    username: username
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 300000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type: TRACE
    org.zalando.logbook: TRACE
    com.nantaaditya: INFO
  file.path: .logs/
  config: classpath:log4j2-spring-${apps.log.log-format}.xml

management:
  server.port: 1001
  endpoint:
    shutdown.access: none
  endpoints:
    web:
      exposure.include: '*'
  tracing:
    baggage:
      correlation:
        fields: requestId
      local-fields: requestId
      remote-fields: requestId

apps:
  version: ${APP_VERSION:1.0.0}
  async:
    configurations:
      default:
        core-pool-size: 1
        max-pool-size: 5
        queue-capacity: 10
        keep-alive-seconds: 30
        thread-name-prefix: async-
    retry-rejected-task:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 50
      keep-alive-seconds: 60
      thread-name-prefix: reject-
    max-retry-rejected-task: 100
  log:
    enable-trace-log: true
    enable-metric-log: true
    enable-api-log: true
    ignored-trace-log-path: '*/swagger-ui,*/swagger-ui/*,*/v3/api-docs,*/v3/api-docs/*'
    sensitive-field: x-client-id
    log-format: json
  swagger:
    host: http://localhost
  retry.configurations:
    default:
      type: EXPONENTIAL_RANDOM
      initial-interval: 500
      multiplier: 1.0
      max-interval: 10000
      max-attempt: 3
  client:
    configurations:
      mock:
        host: https://jsonplaceholder.typicode.com
        timeOut:
          connectTimeOut: 2000
          readTimeOut: 2000
          connectRequestTimeOut: 2000
        pooling:
          maxTotal: 10
          maxPerRoute: 5
        enable-log: true
        disable-ssl-verification: true
    network-configuration:
      socket-time-out: 10000
      time-to-live: 60000
      validate-after-inactivity: 5000
      evict-idle-connection: 15000
