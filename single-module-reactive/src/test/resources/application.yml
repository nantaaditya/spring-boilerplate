server:
  port: 8080

spring:
  application:
    name: app-test
  webflux:
    base-path: ${CONTEXT_PATH:}
  r2dbc:
    url: r2dbc:h2:mem:///test_db
    pool:
      enabled: true
      initial-size: 5
      max-size: 10
      validation-query: SELECT 1
  flyway:
    url: jdbc:h2:mem:test_db
    enabled: false
  sql:
    init:
      mode: always

management:
  server:
    port: 8080
  endpoint:
    shutdown.access: none
    health.show-details: always
  endpoints:
    web:
      exposure.include: '*'
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields:
        - x-client-id
        - x-request-id
      correlation:
        fields:
          - x-client-id
          - x-request-id

logging:
  level:
    root: INFO
    com.nantaaditya: INFO
    org.zalando.logbook: TRACE
    io.r2dbc.h2.client: DEBUG
    io.r2dbc.h2: DEBUG
    io.r2dbc.spi: DEBUG
    org.springframework.r2dbc.core: DEBUG
  file:
    path: ${LOG_FILE_PATH:logs/}
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss:SSS}", "level":"%level", "app_version":"${apps.version}", "class": "%logger{36}", "message":"%enc{%replace{%message}{[\r\n]+}{}}{JSON}. %enc{%replace{%xThrowable}{[\r\n]+}{|}}{JSON}", "trace_id":"%X{traceId}", "span_id":"%X{spanId}", "request_id":"%X{x-request-id}"}\n'

apps:
  version: 1.0.0
  log:
    enable-trace-log: true
    ignored-trace-log-path: ${IGNORED_TRACE_LOG_PATH:*/swagger-ui,*/swagger-ui/*,*/v3/api-docs,*/v3/api-docs/*}
    sensitive-field: ${SENSITIVE_FIELDS:x-client-id}
  scheduler.configurations:
    default-async:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: default-async
        daemon: true
        core-pool-size: 5
        queue-size: 10
        ttl-in-seconds: 60
    retry-listener:
      scheduler-type: BOUNDED_ELASTIC
      bounded-elastic:
        name: retry-listener
        daemon: true
        core-pool-size: 10
        queue-size: 20
        ttl-in-seconds: 60
